[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /tmp/klippy_host_bridge

[printer]
# Remote Klipper instance on printer RPi
# Set KLIPPY_HOST and KLIPPY_PORT in .env
connection_type: socketfile
# For TCP: connection_type: host / klippy_host: <ip> / klippy_port: 7125

[authorization]
trusted_clients:
    192.168.1.0/24
cors_domains:
    *.${DOMAIN}
    http://localhost:*

[update_manager]
enable_auto_refresh: false

# Spoolman integration — tracks filament usage per print job
[spoolman]
server: http://spoolman:7912
sync_rate: 5
