name: Printarr Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'tofu/**'
      - 'docker/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment Action (plan, apply, destroy)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  deploy:
    name: OpenTofu Deployment
    # Must run on self-hosted runner: protects API keys from leaving the local network
    # and ensures direct access to Proxmox without exposing internal endpoints publicly.
    runs-on: self-hosted
    environment: nonprod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Action (Plan vs Apply)
        id: determine_action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
          else
            # Pushes to main imply an approved PR; execute 'apply'
            echo "ACTION=apply" >> $GITHUB_ENV
          fi

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v2.0.0
        with:
          version: "2.30.0"

      - name: Load 1Password Secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PUBLIC_KEY: "op://HomeLab/GitHub-Homelab-Deployer SSH Key/public key"
          PROXMOX_API_TOKEN: "op://HomeLab/Proxmox/password"

      - name: Install OpenTofu
        run: |
          TOFU_VERSION="1.11.0"
          curl -Lo /tmp/tofu.tar.gz \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/tofu.tar.gz -C /tmp tofu
          sudo mv /tmp/tofu /usr/local/bin/tofu
          tofu version

      - name: Validate Formatting
        working-directory: tofu
        run: tofu fmt -check

      - name: OpenTofu Init
        working-directory: tofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_SECRET_ACCESS_KEY }}
        run: tofu init

      - name: OpenTofu Plan / Apply / Destroy
        working-directory: tofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_SECRET_ACCESS_KEY }}
          TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ env.PROXMOX_API_TOKEN }}
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
          TF_VAR_domain: ${{ secrets.DOMAIN }}
        run: tofu ${{ env.ACTION }} -input=false

      - name: Notify ntfy
        if: always()
        run: |
          curl -H "Title: Printarr Deploy ${{ env.ACTION }}" \
               -d "Completed with status: ${{ job.status }}" \
               https://ntfy.apj.dev:30185/infra_alerts
